<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Idle Farm</title><link rel="icon" href="../favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    :root {
      --bg: #171b13; --surface: #21271b; --surface-2: #2b3323; --line: #3a4430;
      --text: #f3eedb; --muted: #a9ae98; --grain: #f1d06b; --coin: #f4a259;
      --green: #8cc152; --green-ink: #15210b; --seed: #c99a6b; --danger: #e07a5f;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { font: 15px/1.4 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; overflow-x: hidden; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .num { font-variant-numeric: tabular-nums; }

    /* ── HUD ── */
    .hud {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
      padding: 10px 16px; background: rgba(23,27,19,0.94); backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--line);
    }
    .brand { font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
    .stats { display: flex; gap: 22px; flex: 1; justify-content: center; }
    .stat { display: flex; flex-direction: column; line-height: 1.15; min-width: 72px; }
    .stat .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .stat .value { font-size: 1.45rem; font-weight: 800; }
    .stat .sub { font-size: 0.78rem; color: var(--muted); }
    .stat.grain .value { color: var(--grain); }
    .stat.coins .value { color: var(--coin); }
    .stat.seeds .value { color: var(--seed); }
    .ghost-btn {
      background: transparent; border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 12px; min-height: 36px; color: var(--muted); font-size: 0.85rem; white-space: nowrap;
    }
    .ghost-btn:hover { color: var(--text); border-color: var(--muted); }

    /* ── Layout ── */
    .layout {
      display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px;
      max-width: 1320px; margin: 0 auto; padding: 16px; align-items: start;
    }
    .farm-col { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .farm-wrap { position: relative; width: min(100%, calc((100dvh - 250px) * 20 / 14)); min-width: min(100%, 420px); }
    #farmCanvas {
      display: block; width: 100%; height: auto; aspect-ratio: 20 / 14;
      border-radius: var(--radius); background: #3b84c4; cursor: pointer;
      image-rendering: pixelated; touch-action: manipulation;
      box-shadow: 0 6px 24px rgba(0,0,0,0.45);
    }

    /* Goals sit on the farm, where the player is already looking. */
    .goal {
      /* Bottom-left, above the road: new fields fill in from the top-left. */
      position: absolute; left: 12px; bottom: calc(100% * 2 / 14 + 8px); max-width: min(340px, calc(100% - 24px));
      background: rgba(23,27,19,0.92); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    .goal h3 { margin: 0 0 4px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--green); }
    .goal p { margin: 0 0 8px; font-size: 0.9rem; }
    .goal .goal-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    progress { appearance: none; -webkit-appearance: none; height: 8px; border: 0; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
    progress::-webkit-progress-bar { background: var(--surface-2); border-radius: 99px; }
    progress::-webkit-progress-value { background: var(--green); border-radius: 99px; transition: width 0.2s; }
    progress::-moz-progress-bar { background: var(--green); border-radius: 99px; }
    .goal progress { flex: 1; min-width: 120px; }
    #nextGoal { padding: 8px 12px; }
    #nextGoal p { margin: 0 0 6px; }
    #nextGoal progress { width: 100%; }

    /* ── Actions ── */
    .actions { display: flex; gap: 10px; width: 100%; max-width: 640px; }
    .btn {
      border: 0; border-radius: var(--radius); min-height: 48px; padding: 8px 16px; font-weight: 800;
      transition: transform 0.08s, filter 0.15s, background 0.15s;
    }
    .btn:active:not(:disabled), .btn.pressed { transform: scale(0.96); }
    .btn:disabled { cursor: not-allowed; opacity: 0.45; }
    .btn-harvest { flex: 1.4; background: var(--green); color: var(--green-ink); font-size: 1.1rem; }
    .btn-harvest:hover { filter: brightness(1.08); }
    .btn-sell { flex: 1; background: var(--coin); color: #2a1606; font-size: 1.05rem; }
    .btn-sell, .btn-stack { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
    .btn-sell:hover:not(:disabled) { filter: brightness(1.08); }
    .btn small { font-weight: 600; font-size: 0.78rem; opacity: 0.8; }
    kbd { font: 600 0.7rem ui-monospace, monospace; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,0.15); margin-left: 6px; vertical-align: 2px; }
    .market { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.88rem; flex-wrap: wrap; justify-content: center; }
    .market label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .market input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--green); }
    .market input[type=number] {
      width: 72px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--surface); color: var(--text); font: inherit;
    }

    /* ── Shop ── */
    .shop { display: flex; flex-direction: column; gap: 12px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .panel h2 { margin: 0; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
    .seg button { border: 0; background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 12px; min-height: 30px; font-weight: 700; font-size: 0.85rem; }
    .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }

    .item {
      display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center;
      padding: 8px; border-radius: 10px; border: 1px solid transparent; position: relative;
    }
    .item + .item { margin-top: 4px; }
    .item.affordable { background: var(--surface-2); }
    .item.best { border-color: rgba(140,193,82,0.55); }
    .item .icon {
      width: 44px; height: 44px; border-radius: 8px; background: var(--surface-2) center / cover no-repeat;
      image-rendering: pixelated; display: grid; place-items: center; font-size: 1.4rem;
    }
    .item .name { font-weight: 800; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .item .owned { font-size: 0.75rem; font-weight: 700; color: var(--muted); background: var(--bg); border-radius: 99px; padding: 0 7px; }
    .item .tag { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--green); }
    .item .desc { font-size: 0.8rem; color: var(--muted); }
    .item .meter { height: 4px; background: var(--bg); border-radius: 99px; margin-top: 5px; overflow: hidden; }
    .item .meter span { display: block; height: 100%; width: 0; background: var(--coin); border-radius: 99px; transition: width 0.2s; }
    .item.affordable .meter span { background: var(--green); }
    .buy {
      min-width: 92px; min-height: 44px; border-radius: 10px; border: 0; padding: 4px 10px;
      background: var(--green); color: var(--green-ink); font-weight: 800; line-height: 1.1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: transform 0.08s, filter 0.15s;
    }
    .buy small { font-size: 0.7rem; font-weight: 700; opacity: 0.75; }
    .buy:hover:not(:disabled) { filter: brightness(1.08); }
    .buy:active:not(:disabled) { transform: scale(0.95); }
    .buy:disabled { background: var(--bg); color: var(--muted); cursor: not-allowed; }
    .item.locked .icon { filter: grayscale(1) brightness(0.5); }
    .item.locked .name { color: var(--muted); }
    .item.pop { animation: pop 0.35s ease-out; }
    @keyframes pop { 0% { background: rgba(140,193,82,0.35); } 100% { background: var(--surface-2); } }

    .season p { margin: 0 0 8px; font-size: 0.88rem; color: var(--muted); }
    .season p strong { color: var(--text); }
    .season progress { width: 100%; margin-bottom: 10px; }
    .season progress::-webkit-progress-value { background: var(--seed); }
    .season progress::-moz-progress-bar { background: var(--seed); }
    .btn-season { width: 100%; background: var(--seed); color: #24170a; }

    details.panel summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; list-style: none; }
    details.panel summary::before { content: "▸ "; }
    details.panel[open] summary::before { content: "▾ "; }
    .data-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .data-buttons button {
      background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
      padding: 6px 10px; min-height: 36px; font-size: 0.82rem;
    }
    .data-buttons .danger { color: var(--danger); border-color: rgba(224,122,95,0.5); margin-left: auto; }

    /* ── Feedback ── */
    .float {
      position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -50%);
      font-weight: 800; font-size: 1.05rem; color: var(--grain); text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      animation: rise 0.9s ease-out forwards;
    }
    .float.coin { color: var(--coin); }
    @keyframes rise { to { transform: translate(-50%, -170%); opacity: 0; } }
    .toast {
      position: fixed; bottom: 16px; right: 16px; z-index: 1000; max-width: 320px;
      background: var(--surface-2); border: 1px solid var(--line); border-left: 4px solid var(--green);
      border-radius: 10px; padding: 10px 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.45);
      opacity: 0; transform: translateY(-10px); transition: opacity 0.25s, transform 0.25s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: none; }
    .toast-title { font-weight: 800; margin-bottom: 2px; }
    #tooltip {
      position: fixed; pointer-events: none; z-index: 500; display: none; max-width: 220px;
      background: rgba(23,27,19,0.95); border: 1px solid var(--line); border-radius: 8px;
      padding: 6px 10px; font-size: 0.82rem;
    }

    /* ── Narrow screens: farm on top, shop below, harvest always within thumb reach. ── */
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
      .farm-col { position: static; }
      .farm-wrap { width: min(100%, calc((100dvh - 230px) * 20 / 14)); }
    }
    @media (max-width: 640px) {
      body { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
      .hud { gap: 10px; padding: 8px 12px; }
      .brand { display: none; }
      .stats { justify-content: flex-start; gap: 14px; }
      .stat { min-width: 0; }
      .stat .value { font-size: 1.2rem; }
      .layout { padding: 10px; gap: 10px; }
      .farm-wrap { width: 100%; min-width: 0; }
      .goal { position: static; max-width: none; margin-top: 8px; }
      .actions {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-width: none;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        background: rgba(23,27,19,0.96); border-top: 1px solid var(--line);
      }
      kbd { display: none; }
      .toast { left: 12px; right: 12px; top: 64px; bottom: auto; max-width: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .float { animation-duration: 0.01s; }
      .item.pop { animation: none; }
      .btn, .buy, .toast { transition: none; }
    }
  </style>
<script src="../assets/music/game-music.js"></script><script src="../assets/music/tracks/idle-farm-seasons.js"></script></head>
<body>
  <header class="hud">
    <div class="brand">🌾 Idle Farm</div>
    <div class="stats">
      <div class="stat grain"><span class="label">Grain</span><span id="grain" class="value num">0</span><span class="sub num">+<span id="pps">0.00</span>/s</span></div>
      <div class="stat coins"><span class="label">Coins</span><span id="coins" class="value num">0</span><span class="sub">1 grain = 1 coin</span></div>
      <div class="stat seeds" id="seedStat" hidden><span class="label">Golden seeds</span><span class="value num">🌰 <span id="tokens">0</span></span><span class="sub num">×<span id="prestigeMult">1.00</span> production</span></div>
    </div>
    <button type="button" class="ghost-btn" data-music="idle-farm:music" hidden>Music on</button>
  </header>

  <main class="layout">
    <section class="farm-col" aria-label="Farm">
      <div class="farm-wrap">
        <canvas id="farmCanvas" aria-label="Your farm. Click or tap it to harvest grain."></canvas>
        <section class="goal" id="firstFieldGoal" aria-labelledby="firstFieldTitle" hidden>
          <h3 id="firstFieldTitle">Your first field</h3>
          <p id="firstFieldHint" role="status"></p>
          <div class="goal-row">
            <progress id="firstFieldProgress" max="15" value="0" aria-label="Grain and coins toward your first field"></progress>
            <button id="firstFieldAction" class="btn btn-harvest" type="button" hidden></button>
          </div>
        </section>
        <section class="goal" id="nextGoal" hidden>
          <h3>Next goal</h3>
          <p id="nextGoalText" role="status"></p>
          <progress id="nextGoalProgress" max="1" value="0" aria-label="Progress toward the next goal"></progress>
        </section>
      </div>
      <div class="actions">
        <button id="harvestBtn" class="btn btn-harvest btn-stack" type="button" title="Harvest (H)"><span>🌾 Harvest<kbd>H</kbd></span><small id="harvestAmount">+1 🌾</small></button>
        <button id="sellAll" class="btn btn-sell" type="button" title="Sell all grain (S)"><span>Sell all<kbd>S</kbd></span><small id="sellAmount">+0 🪙</small></button>
      </div>
      <div class="market">
        <label><input type="checkbox" id="autoSell" /> Auto-sell</label>
        <label>when grain reaches <input type="number" id="autoSellThreshold" value="100" min="1" inputmode="numeric" /></label>
      </div>
    </section>

    <aside class="shop" aria-label="Shop">
      <section class="panel">
        <div class="panel-head">
          <h2>Farm</h2>
          <div class="seg" id="buyMode" role="group" aria-label="Purchase amount">
            <button type="button" data-mode="1" aria-pressed="true">×1</button>
            <button type="button" data-mode="10" aria-pressed="false">×10</button>
            <button type="button" data-mode="max" aria-pressed="false">Max</button>
          </div>
        </div>
        <div id="producersList"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Upgrades</h2></div>
        <div class="item" id="fertItem">
          <div class="icon" aria-hidden="true">🧪</div>
          <div>
            <div class="name">Fertilizer <span class="owned num" id="fertLevel">Lv 0</span></div>
            <div class="desc" id="fertilizerInfo"></div>
            <div class="meter"><span id="fertMeter"></span></div>
          </div>
          <button id="fertilizerBtn" class="buy" type="button"></button>
        </div>
      </section>

      <section class="panel season">
        <div class="panel-head"><h2>New season</h2></div>
        <p id="prestigeInfo"></p>
        <progress id="prestigeProgress" max="1" value="0" aria-label="Progress toward the next golden seed"></progress>
        <button id="prestigeBtn" class="btn btn-season" type="button">New season</button>
      </section>

      <details class="panel">
        <summary>Save data</summary>
        <div class="data-buttons">
          <button id="exportCopy" type="button">Copy save</button>
          <button id="exportDownload" type="button">Download save</button>
          <input type="file" id="importFile" accept="application/json" hidden />
          <button id="importFileBtn" type="button">Import file</button>
          <button id="importPasteBtn" type="button">Paste save</button>
          <button id="resetBtn" class="danger" type="button">Reset farm</button>
        </div>
      </details>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <div class="toast-title" id="toastTitle"></div>
    <div id="toastBody"></div>
  </div>
  <div id="tooltip"></div>

  <script src="vendor/three-0.160.0.min.js"></script>
  <script>
    (function() {
      if (typeof THREE === 'undefined') {
        console.error('Three.js failed to load. Check your internet connection.');
        document.body.insertAdjacentHTML('afterbegin', '<div style="color:#e07a5f;font-weight:bold;padding:10px;text-align:center;">Error: The farm renderer could not load. Keep the vendor folder beside index.html.</div>');
        return;
      }

      // ─── Constants & Economy ───
      const CONST = {
        SAVE_KEY: "idle_farm_save_v2",
        PRODUCERS: [
          { id: "field",    name: "Field",    baseCost: 15,    growth: 1.15, pps: 0.5,  icon: "🌱" },
          { id: "farmhand", name: "Farmhand", baseCost: 100,   growth: 1.16, pps: 2,    icon: "🧑‍🌾" },
          { id: "barn",     name: "Barn",     baseCost: 1100,  growth: 1.15, pps: 15,   icon: "🏚️" },
          { id: "tractor",  name: "Tractor",  baseCost: 12000, growth: 1.14, pps: 100,  icon: "🚜" }
        ],
        FERT_BASE_COST: 500, FERT_GROWTH: 2.0, FERT_MULT_PER_LEVEL: 0.20,
        PRESTIGE_DIVISOR: 1000, PRESTIGE_POWER: 0.5, PRESTIGE_MULT_PER_TOKEN: 0.10,
        HARVEST_SHARE: 0.05, // Each harvest also gathers this share of a second's production.
        AUTOSAVE_MS: 10000, SIM_DT: 0.05, RENDER_MS: 50
      };

      const now = () => Date.now();
      const defaultState = () => ({
        grain: 0, coins: 0,
        producers: Object.fromEntries(CONST.PRODUCERS.map(p => [p.id, 0])),
        fertilizerLevel: 0, prestigeTokens: 0,
        stats: { coinsEarned: 0, grainSold: 0, manualHarvests: 0 },
        lastSavedTs: now(), settings: { autoSell: false, autoSellThreshold: 100 }
      });

      let toastTimer = null;
      function showToast(title, body) {
        const t = document.getElementById("toast");
        if (!t) return;
        document.getElementById("toastTitle").textContent = title;
        document.getElementById("toastBody").textContent = body;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 4000);
      }

      function prestigeMultiplier(state) {
        return 1 + (state.prestigeTokens || 0) * CONST.PRESTIGE_MULT_PER_TOKEN;
      }
      function globalMultiplier(state) {
        return (1 + CONST.FERT_MULT_PER_LEVEL * state.fertilizerLevel) * prestigeMultiplier(state);
      }
      function productionPerSec(state) {
        const base = CONST.PRODUCERS.reduce((sum, p) => sum + (state.producers[p.id] || 0) * p.pps, 0);
        return base * globalMultiplier(state);
      }
      function format(n) {
        if (n >= 1e12) return (n/1e12).toFixed(2) + "T";
        if (n >= 1e9)  return (n/1e9).toFixed(2) + "B";
        if (n >= 1e6)  return (n/1e6).toFixed(2) + "M";
        if (n >= 1e3)  return (n/1e3).toFixed(2) + "K";
        return Math.floor(n);
      }
      function formatRate(n) {
        return n >= 100 ? String(format(n)) : n.toFixed(n >= 10 ? 1 : 2);
      }
      function harvestValue(state) {
        return Math.max(1, Math.round(productionPerSec(state) * CONST.HARVEST_SHARE));
      }
      function formatTime(sec) {
        if (sec < 60) return Math.floor(sec) + "s";
        if (sec < 3600) return Math.floor(sec/60) + "m";
        if (sec < 86400) return Math.floor(sec/3600) + "h";
        return Math.floor(sec/86400) + "d " + Math.floor((sec%86400)/3600) + "h";
      }
      function prodMeta(id) { return CONST.PRODUCERS.find(p => p.id === id); }
      function costAt(id, level) {
        const m = prodMeta(id); return Math.floor(m.baseCost * Math.pow(m.growth, level));
      }
      function fertilizerCost(level) {
        return Math.floor(CONST.FERT_BASE_COST * Math.pow(CONST.FERT_GROWTH, level));
      }
      function totalCost(id, startLevel, count) {
        let sum = 0;
        for (let i = 0; i < count; i++) sum += costAt(id, startLevel + i);
        return sum;
      }
      function maxAffordable(id, coins, startLevel) {
        let k = 0, spent = 0;
        while (true) {
          const c = costAt(id, startLevel + k);
          if (coins < spent + c) break;
          spent += c; k++;
          if (k > 100000) break;
        }
        return { k, cost: spent };
      }

      let S, pausedSince = null;
      let storageWarningShown = false;
      function normalizeSave(obj) {
        if (!obj || typeof obj !== "object" || Array.isArray(obj)) throw new Error("Invalid save");
        const next = defaultState();
        function number(value, fallback, integer = false) {
          if (value === undefined) return fallback;
          if (!Number.isFinite(value) || value < 0 || value > 1e100 || (integer && !Number.isSafeInteger(value))) throw new Error("Invalid save number");
          return value;
        }
        for (const key of ["grain", "coins"]) next[key] = number(obj[key], next[key]);
        for (const key of ["fertilizerLevel", "prestigeTokens"]) next[key] = number(obj[key], next[key], true);
        if (obj.producers !== undefined && (!obj.producers || typeof obj.producers !== "object" || Array.isArray(obj.producers))) throw new Error("Invalid producers");
        for (const p of CONST.PRODUCERS) next.producers[p.id] = number(obj.producers?.[p.id] ?? (p.id === "field" ? obj.fields : undefined), 0, true);
        for (const key of Object.keys(next.stats)) next.stats[key] = number(obj.stats?.[key], 0);
        next.settings.autoSell = obj.settings?.autoSell === true;
        next.settings.autoSellThreshold = Math.max(1, number(obj.settings?.autoSellThreshold, 100));
        next.lastSavedTs = Math.min(now(), number(obj.lastSavedTs, now()));
        if (!Number.isFinite(productionPerSec(next)) || productionPerSec(next) > 1e100) throw new Error("Invalid production");
        return next;
      }
      function load() {
        try {
          const raw = localStorage.getItem(CONST.SAVE_KEY) ?? localStorage.getItem("idle_farm_save_v1");
          if (!raw) return defaultState();
          const obj = normalizeSave(JSON.parse(raw));
          const deltaSec = Math.max(0, (now() - obj.lastSavedTs) / 1000);
          const offlineGrain = productionPerSec(obj) * deltaSec;
          obj.grain += offlineGrain;
          obj.lastSavedTs = now();
          if (deltaSec > 5 && offlineGrain >= 1) showToast("Welcome back!", "Your farm grew " + format(offlineGrain) + " grain while you were away (" + formatTime(deltaSec) + ").");
          return obj;
        } catch { return defaultState(); }
      }
      function save() {
        const timestamp = now();
        // Settle hidden production before moving the save timestamp forward.
        if (pausedSince !== null) {
          S.grain += productionPerSec(S) * Math.max(0, timestamp - pausedSince) / 1000;
          pausedSince = timestamp;
        }
        S.lastSavedTs = timestamp;
        try { localStorage.setItem(CONST.SAVE_KEY, JSON.stringify(S)); }
        catch {
          if (!storageWarningShown) showToast("Saving unavailable", "You can keep playing. Export your save before closing this tab.");
          storageWarningShown = true;
        }
      }
      function importSave(obj) {
        const next = normalizeSave(obj);
        next.lastSavedTs = now();
        S = next;
        if (pausedSince !== null) pausedSince = now();
        save(); render(); updateFarmVisuals();
        showToast("Imported", "Save loaded successfully!");
      }

      S = load();

      // ─── Best Buy Calculator ───
      function bestBuyEfficiency() {
        let best = null, bestEff = 0;
        CONST.PRODUCERS.forEach(p => {
          const owned = S.producers[p.id] || 0;
          const cost = costAt(p.id, owned);
          if (S.coins >= cost && isUnlocked(p.id)) {
            const eff = p.pps / cost;
            if (eff > bestEff) { bestEff = eff; best = p.id; }
          }
        });
        return best;
      }
      // Each producer appears once the player owns the one before it.
      function isUnlocked(id) {
        const i = CONST.PRODUCERS.findIndex(p => p.id === id);
        return i === 0 || S.producers[id] > 0 || S.producers[CONST.PRODUCERS[i - 1].id] > 0;
      }

      // ─── UI Elements ───
      const $ = id => document.getElementById(id);
      const elGrain = $("grain"), elCoins = $("coins"), elPps = $("pps");
      const elProducersList = $("producersList");
      const btnHarvest = $("harvestBtn"), btnSellAll = $("sellAll"), elSellAmount = $("sellAmount");
      const elBuyMode = $("buyMode");
      const btnFertilizer = $("fertilizerBtn"), elFertInfo = $("fertilizerInfo");
      const elTokens = $("tokens"), elPrestigeMult = $("prestigeMult");
      const btnPrestige = $("prestigeBtn"), elPrestigeInfo = $("prestigeInfo");
      const cbAutoSell = $("autoSell"), inpAutoSellThreshold = $("autoSellThreshold");
      let buyMode = "1";

      cbAutoSell.checked = S.settings?.autoSell || false;
      inpAutoSellThreshold.value = S.settings?.autoSellThreshold || 100;

      // Writes only when a value changes, since render runs twenty times a second.
      function setText(el, value) { value = String(value); if (el.textContent !== value) el.textContent = value; }
      function setHTML(el, value) { if (el.innerHTML !== value) el.innerHTML = value; }
      function setWidth(el, fraction) { const w = (Math.max(0, Math.min(1, fraction)) * 100).toFixed(1) + "%"; if (el.style.width !== w) el.style.width = w; }

      // Build producer rows
      const UI = { prods: {} };
      function ensureProducerRows() {
        if (Object.keys(UI.prods).length) return;
        CONST.PRODUCERS.forEach(p => {
          const row = document.createElement("div"); row.className = "item";
          row.innerHTML =
            '<div class="icon" aria-hidden="true"></div>' +
            '<div><div class="name"><span></span><span class="owned num"></span><span class="tag" hidden>Best value</span></div>' +
            '<div class="desc"></div><div class="meter"><span></span></div></div>' +
            '<button class="buy" type="button"></button>';
          const [icon, info, btn] = row.children;
          const [nameEl, countEl, tag] = info.firstChild.children;
          icon.textContent = p.icon; nameEl.textContent = p.name;
          countEl.id = "count_" + p.id; countEl.textContent = "0"; btn.id = "btn_" + p.id;
          const desc = info.children[1], meter = info.querySelector(".meter span");

          btn.addEventListener("click", function() {
            const ok = buyMode === "max" ? buyProducerMax(p.id) : buyProducer(p.id, Number(buyMode));
            if (!ok) return;
            row.classList.remove("pop"); void row.offsetWidth; row.classList.add("pop");
            render(); updateFarmVisuals();
          });

          elProducersList.appendChild(row);
          UI.prods[p.id] = { row, icon, countEl, btn, desc, meter, tag };
        });
      }

      function nextPurchaseInfo(id) {
        const p = prodMeta(id); const owned = S.producers[id] || 0;
        const mult = globalMultiplier(S);
        if (buyMode === "1") {
          const cost = costAt(id, owned);
          return { n: 1, cost, dpps: p.pps * mult };
        }
        if (buyMode === "10") {
          const cost = totalCost(id, owned, 10);
          return { n: 10, cost, dpps: 10 * p.pps * mult };
        }
        const res = maxAffordable(id, S.coins, owned);
        return { n: res.k, cost: res.cost, dpps: res.k * p.pps * mult };
      }

      function firstFieldGoal(state) {
        if (CONST.PRODUCERS.some(p => state.producers[p.id] > 0) || state.prestigeTokens > 0) return { phase: 'done', progress: 15 };
        const progress = Math.min(15, Math.floor(state.grain) + Math.floor(state.coins));
        if (state.coins >= 15) return { phase: 'buy', progress, text: 'You have 15 coins. Plant your first field and it will grow 0.5 grain every second on its own.' };
        if (progress >= 15) return { phase: 'sell', progress, text: 'Enough grain! Sell it for coins, then plant your first field.' };
        return { phase: 'harvest', progress, text: `Tap the farm or press Harvest to gather ${15-progress} more grain. Grain sells for 1 coin and a field costs 15.` };
      }
      function renderFirstFieldGoal() {
        const goal = firstFieldGoal(S), panel = $('firstFieldGoal');
        panel.hidden = goal.phase === 'done';
        if (panel.hidden) return;
        setText($('firstFieldHint'), goal.text);
        $('firstFieldProgress').value = goal.progress;
        const button = $('firstFieldAction');
        button.hidden = goal.phase === 'harvest';
        setText(button, goal.phase === 'buy' ? 'Buy first field · 15 coins' : 'Sell grain');
      }

      // After the first field, a short chain of goals points at the next thing worth buying.
      const GOALS = [
        { text: "Hire a farmhand", progress: s => s.producers.farmhand > 0 ? 1 : s.coins / costAt("farmhand", 0) },
        { text: "Grow to 10 fields", progress: s => s.producers.field / 10 },
        { text: "Spread fertilizer to boost every crop", progress: s => s.fertilizerLevel > 0 ? 1 : s.coins / fertilizerCost(0) },
        { text: "Build a barn", progress: s => s.producers.barn > 0 ? 1 : s.coins / costAt("barn", 0) },
        { text: "Earn 1K lifetime coins, then start a new season", progress: s => s.prestigeTokens > 0 ? 1 : Math.min(0.99, s.stats.coinsEarned / CONST.PRESTIGE_DIVISOR) }
      ];
      let shownGoal = null;
      function renderNextGoal(firstFieldDone) {
        const panel = $("nextGoal");
        const index = S.prestigeTokens > 0 ? GOALS.length : GOALS.findIndex(g => g.progress(S) < 1);
        const goal = GOALS[index];
        if (shownGoal !== null && index > shownGoal && GOALS[shownGoal]) showToast("Goal complete", GOALS[shownGoal].text + ".");
        shownGoal = index < 0 ? GOALS.length : index;
        panel.hidden = !firstFieldDone || !goal;
        if (panel.hidden) return;
        setText($("nextGoalText"), goal.text);
        $("nextGoalProgress").value = Math.max(0, Math.min(1, goal.progress(S)));
      }

      function render() {
        renderFirstFieldGoal();
        renderNextGoal($('firstFieldGoal').hidden);
        setText(elGrain, format(S.grain));
        setText(elCoins, format(S.coins));
        setText(elPps, formatRate(productionPerSec(S)));
        ensureProducerRows();

        const best = bestBuyEfficiency(), mult = globalMultiplier(S);
        CONST.PRODUCERS.forEach((p, i) => {
          const owned = S.producers[p.id] || 0;
          const els = UI.prods[p.id]; if (!els) return;
          setText(els.countEl, owned);
          const unlocked = isUnlocked(p.id);
          els.row.classList.toggle("locked", !unlocked);
          els.btn.hidden = !unlocked;
          els.countEl.hidden = !unlocked;
          if (!unlocked) {
            setText(els.desc, "Unlocks with your first " + CONST.PRODUCERS[i - 1].name.toLowerCase());
            setWidth(els.meter, 0); els.tag.hidden = true;
            els.row.classList.remove("affordable", "best");
            return;
          }
          const info = nextPurchaseInfo(p.id);
          const each = p.pps * mult;
          // Max mode with nothing affordable shows the price of one.
          const shownCost = info.n > 0 ? info.cost : costAt(p.id, owned);
          const affordable = info.n > 0 && S.coins >= info.cost;
          setText(els.desc, "+" + formatRate(each) + "/s each" + (owned ? " · " + formatRate(owned * each) + "/s total" : ""));
          setHTML(els.btn, (info.n > 1 || buyMode !== "1" ? "<small>×" + Math.max(1, info.n) + "</small>" : "") + format(shownCost) + " 🪙");
          els.btn.disabled = !affordable;
          els.btn.setAttribute("aria-label", "Buy " + Math.max(1, info.n) + " " + p.name + " for " + format(shownCost) + " coins");
          setWidth(els.meter, S.coins / shownCost);
          els.row.classList.toggle("affordable", affordable);
          els.row.classList.toggle("best", best === p.id);
          els.tag.hidden = best !== p.id || CONST.PRODUCERS.filter(q => isUnlocked(q.id)).length < 2;
        });

        const fertCost = fertilizerCost(S.fertilizerLevel);
        setText($("fertLevel"), "Lv " + S.fertilizerLevel);
        setText(elFertInfo, "+20% to all crops · now " + (100 * (1 + CONST.FERT_MULT_PER_LEVEL * S.fertilizerLevel)).toFixed(0) + "%");
        setText(btnFertilizer, format(fertCost) + " 🪙");
        btnFertilizer.disabled = S.coins < fertCost;
        setWidth($("fertMeter"), S.coins / fertCost);
        $("fertItem").classList.toggle("affordable", S.coins >= fertCost);

        renderSeason();

        setText($("harvestAmount"), "+" + format(harvestValue(S)) + " 🌾");
        setText(elSellAmount, "+" + format(Math.floor(S.grain)) + " 🪙");
        btnSellAll.disabled = S.grain < 1;
      }

      function renderSeason() {
        const tokens = S.prestigeTokens || 0, earned = S.stats.coinsEarned || 0;
        const potential = prestigePotentialTokens(), gain = Math.max(0, potential - tokens);
        const prevAt = Math.pow(potential, 2) * CONST.PRESTIGE_DIVISOR, nextAt = Math.pow(potential + 1, 2) * CONST.PRESTIGE_DIVISOR;
        $("seedStat").hidden = tokens === 0;
        setText(elTokens, tokens);
        setText(elPrestigeMult, prestigeMultiplier(S).toFixed(2));
        $("prestigeProgress").value = (earned - prevAt) / (nextAt - prevAt);
        const after = (1 + (tokens + gain) * CONST.PRESTIGE_MULT_PER_TOKEN).toFixed(2);
        setHTML(elPrestigeInfo, gain > 0
          ? "Start over with <strong>+" + gain + " golden seed" + (gain > 1 ? "s" : "") + "</strong>: production ×" + prestigeMultiplier(S).toFixed(2) + " → <strong>×" + after + "</strong>, forever. Fields, buildings, coins and fertilizer reset. Next seed at " + format(nextAt) + " lifetime coins."
          : "Each golden seed adds <strong>+10%</strong> to all production, forever. Your next seed comes at <strong>" + format(nextAt) + "</strong> lifetime coins (" + format(earned) + " so far).");
        setText(btnPrestige, gain > 0 ? "Start new season · +" + gain + " 🌰" : "New season");
        btnPrestige.disabled = gain <= 0;
      }

      // Actions
      function buyProducer(id, count) {
        if (count <= 0) return false;
        const owned = S.producers[id] || 0;
        const cost = totalCost(id, owned, count);
        if (S.coins < cost) return false;
        S.coins -= cost;
        S.producers[id] = owned + count;
        save(); return true;
      }
      function buyProducerMax(id) {
        const owned = S.producers[id] || 0;
        const res = maxAffordable(id, S.coins, owned);
        if (res.k < 1) return false;
        S.coins -= res.cost;
        S.producers[id] = owned + res.k;
        save(); return true;
      }
      function sellAllGrain() {
        const sell = Math.floor(S.grain);
        if (sell <= 0) return false;
        S.grain -= sell; S.coins += sell;
        S.stats.coinsEarned += sell; S.stats.grainSold += sell;
        save(); spawnFloatingText("+" + format(sell) + " 🪙", btnSellAll, "coin"); return true;
      }
      function buyFertilizer() {
        const c = fertilizerCost(S.fertilizerLevel);
        if (S.coins < c) return false;
        S.coins -= c; S.fertilizerLevel += 1;
        save(); return true;
      }

      // Prestige
      function prestigePotentialTokens() {
        return Math.floor(Math.pow((S.stats.coinsEarned || 0) / CONST.PRESTIGE_DIVISOR, CONST.PRESTIGE_POWER));
      }
      function prestigeGain() {
        return Math.max(0, prestigePotentialTokens() - (S.prestigeTokens || 0));
      }
      function doPrestige() {
        const gain = prestigeGain();
        if (gain <= 0) return false;
        S.prestigeTokens += gain;
        S.grain = 0; S.coins = 0; S.fertilizerLevel = 0;
        S.producers = Object.fromEntries(CONST.PRODUCERS.map(p => [p.id, 0]));
        save(); return true;
      }

      // ─── THREE.JS FARM VISUALS ───
      const canvas = $("farmCanvas");
      const scene = new THREE.Scene();
      const TILE = 48, PX = 24;
      const GRID_W = 20, GRID_H = 14;

      const camera = new THREE.OrthographicCamera(
        -GRID_W * TILE / 2, GRID_W * TILE / 2,
        GRID_H * TILE / 2, -GRID_H * TILE / 2,
        1, 1000
      );
      camera.position.set(0, 0, 100);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      // CSS sizes the canvas; the drawing buffer keeps the farm's 20×14 aspect.
      renderer.setSize(GRID_W * TILE, GRID_H * TILE, false);

      // Seeded so the terrain looks the same on every visit.
      let seed = 7;
      const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;

      // 24×24 pixel-art sprites, drawn at 2× per world tile.
      function makeSprite(draw) {
        const cvs = document.createElement("canvas");
        cvs.width = cvs.height = PX;
        const ctx = cvs.getContext("2d");
        draw(function(color, x, y, w, h) { ctx.fillStyle = color; ctx.fillRect(x, y, w || 1, h || 1); });
        const tex = new THREE.CanvasTexture(cvs);
        tex.magFilter = tex.minFilter = THREE.NearestFilter;
        tex.generateMipmaps = false;
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }
      function scatter(px, color, count, w, h) {
        for (let i = 0; i < count; i++) px(color, Math.floor(rnd() * PX), Math.floor(rnd() * PX), w, h);
      }
      const SHADOW = "rgba(0,0,0,0.22)";

      const sprites = {
        grass: [0, 1, 2].map(v => makeSprite(px => {
          px("#5b9a43", 0, 0, PX, PX);
          scatter(px, "#68aa4e", 12, 1, 2); scatter(px, "#4f8a3a", 9);
          if (v === 2) { px("#f6e27f", 5, 7); px("#f6e27f", 17, 15); }
        })),
        water: [0, 1].map(f => makeSprite(px => {
          px("#3b84c4", 0, 0, PX, PX);
          for (let i = 0; i < 4; i++) {
            const y = 2 + i * 6, x = (i * 7 + f * 3) % PX;
            px("#5fa6dc", x, y, 5, 1); px("#5fa6dc", (x + 12) % PX, y + 3, 4, 1);
          }
        })),
        road: makeSprite(px => {
          px("#b48a52", 0, 0, PX, PX); px("#a1784a", 0, 6, PX, 2); px("#a1784a", 0, 16, PX, 2);
          scatter(px, "#c69c63", 10);
        }),
        path: makeSprite(px => {
          px("#5b9a43", 0, 0, PX, PX); px("#b48a52", 4, 0, 16, PX);
          scatter(px, "#68aa4e", 4, 1, 2); px("#a1784a", 9, 0, 1, PX); px("#a1784a", 14, 0, 1, PX);
        }),
        field: [0, 1, 2].map(stage => makeSprite(px => {
          px("#6b4529", 0, 0, PX, PX);
          for (let y = 0; y < PX; y += 6) px("#5a3920", 0, y + 4, PX, 2);
          for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) {
            const x = 1 + i * 6, y = j * 6;
            if (stage === 0) { px("#8fd16a", x + 1, y + 2, 1, 2); px("#8fd16a", x + 2, y + 1); }
            else if (stage === 1) { px("#5fa83f", x + 1, y, 1, 4); px("#8fd16a", x, y + 1); px("#8fd16a", x + 2, y + 2); }
            else { px("#c99a3a", x + 1, y + 2, 1, 2); px("#f1d06b", x, y, 3, 2); }
          }
        })),
        farmhand: makeSprite(px => {
          px(SHADOW, 4, 21, 17, 2);
          px("#7f3a2a", 16, 3, 3, 5);
          for (let i = 0; i < 7; i++) px("#b4533c", 11 - i, 4 + i, 2 + 2 * i, 1);
          px("#8f3f2d", 4, 11, 16, 1);
          px("#ecd6a4", 5, 12, 14, 9);
          px("#7a4a2a", 10, 15, 4, 6);
          px("#8fd0f0", 6, 14, 3, 3); px("#8fd0f0", 15, 14, 3, 3);
        }),
        barn: makeSprite(px => {
          px(SHADOW, 2, 21, 21, 2);
          px("#7d241d", 7, 2, 10, 2); px("#7d241d", 4, 4, 16, 2); px("#7d241d", 2, 6, 20, 3);
          px("#f1d06b", 10, 4, 4, 2);
          px("#b23a2e", 3, 9, 18, 12); px("#f3eedb", 3, 9, 18, 1);
          px("#f3eedb", 8, 13, 8, 8); px("#b23a2e", 9, 14, 6, 6);
          for (let i = 0; i < 6; i++) { px("#f3eedb", 9 + i, 14 + i); px("#f3eedb", 14 - i, 14 + i); }
        }),
        tractor: makeSprite(px => {
          px(SHADOW, 3, 21, 18, 2);
          px("#3a3a3a", 6, 5, 2, 6);
          px("#c43a2c", 12, 4, 7, 7); px("#9fd8f2", 13, 5, 5, 4);
          px("#d94a3a", 3, 11, 16, 5); px("#c43a2c", 3, 10, 9, 1);
          px("#2b2b2b", 13, 13, 6, 10); px("#2b2b2b", 12, 14, 8, 8); px("#9a9a9a", 15, 17, 2, 2);
          px("#2b2b2b", 3, 16, 6, 5); px("#2b2b2b", 4, 15, 4, 7); px("#9a9a9a", 5, 18, 2, 1);
        }),
        grain: makeSprite(px => { px("#f1d06b", 8, 8, 8, 8); px("#fff3b0", 10, 10, 3, 3); })
      };

      // Shop icons reuse the farm's sprites so both read as the same world.
      ensureProducerRows();
      CONST.PRODUCERS.forEach(p => {
        const tex = p.id === "field" ? sprites.field[2] : sprites[p.id];
        const icon = UI.prods[p.id].icon;
        icon.textContent = ""; icon.style.backgroundImage = "url(" + tex.image.toDataURL() + ")";
      });

      // Terrain: water border, crop land on the left, a path, building lots on the right, a road below.
      const tileGeo = new THREE.PlaneGeometry(TILE, TILE);
      const materials = {};
      function mat(tex, opacity) {
        const key = tex.uuid + ":" + (opacity || 1);
        return materials[key] || (materials[key] = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: opacity || 1 }));
      }
      const waterMat = new THREE.MeshBasicMaterial({ map: sprites.water[0] });
      const cellPos = (gx, gy) => ({ x: (gx - GRID_W/2 + 0.5) * TILE, y: -(gy - GRID_H/2 + 0.5) * TILE });
      for (let y = 0; y < GRID_H; y++) for (let x = 0; x < GRID_W; x++) {
        const edge = x === 0 || y === 0 || x === GRID_W - 1 || y === GRID_H - 1;
        const material = edge ? waterMat
          : y === GRID_H - 2 ? mat(sprites.road)
          : x === 12 ? mat(sprites.path)
          : mat(sprites.grass[rnd() < 0.04 ? 2 : rnd() < 0.5 ? 1 : 0]);
        const mesh = new THREE.Mesh(tileGeo, material);
        const pos = cellPos(x, y); mesh.position.set(pos.x, pos.y, 0);
        scene.add(mesh);
      }

      // [first column, first row, columns, rows] for each producer's lot.
      const ZONES = { field: [1, 1, 11, 10], farmhand: [13, 1, 6, 4], barn: [13, 6, 6, 5] };
      const ROAD_Y = cellPos(0, GRID_H - 2).y, ROAD_MIN = cellPos(1, 0).x, ROAD_MAX = cellPos(GRID_W - 2, 0).x;
      const buildingsGroup = new THREE.Group();
      scene.add(buildingsGroup);
      let fieldMeshes = [], tractors = [];

      function updateFarmVisuals() {
        buildingsGroup.clear(); fieldMeshes = []; tractors = [];
        Object.keys(ZONES).forEach(function(id) {
          const [x0, y0, cols, rows] = ZONES[id], owned = S.producers[id] || 0;
          // One faded slot marks where the next purchase will appear.
          const shown = Math.min(owned + (isUnlocked(id) ? 1 : 0), cols * rows);
          for (let i = 0; i < shown; i++) {
            const ghost = i >= owned, pos = cellPos(x0 + i % cols, y0 + Math.floor(i / cols));
            const tex = id === "field" ? sprites.field[ghost ? 0 : 2] : sprites[id];
            const mesh = new THREE.Mesh(tileGeo, mat(tex, ghost ? 0.3 : 1));
            mesh.position.set(pos.x, pos.y, 1);
            mesh.userData = { id: id, ghost: ghost, phase: rnd(), stage: -1 };
            buildingsGroup.add(mesh);
            if (id === "field" && !ghost) fieldMeshes.push(mesh);
          }
        });
        for (let i = 0; i < Math.min(S.producers.tractor || 0, 6); i++) {
          const mesh = new THREE.Mesh(tileGeo, mat(sprites.tractor));
          mesh.position.set(ROAD_MIN + rnd() * (ROAD_MAX - ROAD_MIN), ROAD_Y, 2 + i * 0.01);
          mesh.userData = { id: "tractor", dir: rnd() < 0.5 ? -1 : 1, speed: 40 + rnd() * 40 };
          buildingsGroup.add(mesh); tractors.push(mesh);
        }
      }

      function spawnFloatingText(text, anchor, kind) {
        let x, y;
        if (anchor && typeof anchor.x === "number") { x = anchor.x; y = anchor.y; }
        else {
          const r = (anchor || canvas).getBoundingClientRect();
          x = r.left + r.width / 2 + (Math.random() - 0.5) * r.width * 0.4; y = r.top;
        }
        const el = document.createElement("div");
        el.className = "float" + (kind ? " " + kind : "");
        el.textContent = text;
        el.style.left = x + "px"; el.style.top = y + "px";
        document.body.appendChild(el);
        setTimeout(function() { el.remove(); }, 900);
      }

      const particles = [], particleGeo = new THREE.PlaneGeometry(14, 14);
      function addParticle(x, y, vx, vy, gravity) {
        if (particles.length > 90) return;
        const mesh = new THREE.Mesh(particleGeo, new THREE.MeshBasicMaterial({ map: sprites.grain, transparent: true }));
        mesh.position.set(x, y, 5);
        scene.add(mesh);
        particles.push({ mesh: mesh, life: 1, vx: vx, vy: vy, g: gravity });
      }
      function toWorld(point) {
        const r = canvas.getBoundingClientRect();
        return { x: ((point.x - r.left) / r.width - 0.5) * GRID_W * TILE, y: (0.5 - (point.y - r.top) / r.height) * GRID_H * TILE };
      }
      // A burst at a click point, or a puff from the crops when harvesting from the button.
      function spawnGrainParticles(count, anchor) {
        let origin;
        if (anchor && typeof anchor.x === "number") origin = toWorld(anchor);
        else if (fieldMeshes.length) origin = fieldMeshes[Math.floor(Math.random() * fieldMeshes.length)].position;
        else origin = cellPos(1 + Math.floor(Math.random() * 11), 1 + Math.floor(Math.random() * 10));
        for (let i = 0; i < Math.min(8, 2 + count * 2); i++) {
          addParticle(origin.x, origin.y, (Math.random() - 0.5) * 220, 120 + Math.random() * 140, 420);
        }
      }

      // Click or tap the farm to harvest.
      canvas.addEventListener("pointerdown", function(e) {
        if (e.button > 0) return;
        harvest({ x: e.clientX, y: e.clientY });
      });

      // Tooltip
      const tooltip = $("tooltip");
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      canvas.addEventListener("pointermove", function(e) {
        if (e.pointerType !== "mouse") return;
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hit = raycaster.intersectObjects(buildingsGroup.children)[0];
        if (!hit) { tooltip.style.display = "none"; return; }
        const data = hit.object.userData, p = prodMeta(data.id), owned = S.producers[p.id] || 0;
        tooltip.innerHTML = data.ghost
          ? "<strong>Empty lot</strong><br/>Your next " + p.name.toLowerCase() + " goes here."
          : "<strong>" + p.name + "</strong> ×" + owned + "<br/>" + formatRate(owned * p.pps * globalMultiplier(S)) + " grain/s";
        tooltip.style.display = "block";
        tooltip.style.left = (e.clientX + 14) + "px";
        tooltip.style.top = (e.clientY + 14) + "px";
      });
      canvas.addEventListener("pointerleave", function() { tooltip.style.display = "none"; });

      // ─── Game Loop ───
      let rafId = null, lastTime = now(), acc = 0, lastRender = 0;

      function animateFarm(t, dt) {
        waterMat.map = sprites.water[Math.floor(t / 700) % 2];
        // Each field cycles sprout → green → golden; a golden field releasing grain marks a harvest.
        const cycle = 6 / Math.min(3, globalMultiplier(S));
        fieldMeshes.forEach(function(mesh) {
          const stage = Math.floor(((t / 1000 / cycle + mesh.userData.phase) % 1) * 3);
          if (stage === mesh.userData.stage) return;
          if (mesh.userData.stage === 2 && stage === 0 && Math.random() < 0.6) {
            addParticle(mesh.position.x, mesh.position.y, (Math.random() - 0.5) * 30, 50 + Math.random() * 30, 0);
          }
          mesh.userData.stage = stage;
          mesh.material = mat(sprites.field[stage]);
        });
        tractors.forEach(function(mesh) {
          const d = mesh.userData;
          mesh.position.x += d.dir * d.speed * dt;
          if (mesh.position.x > ROAD_MAX) { mesh.position.x = ROAD_MAX; d.dir = -1; }
          if (mesh.position.x < ROAD_MIN) { mesh.position.x = ROAD_MIN; d.dir = 1; }
          mesh.scale.x = -d.dir; // The sprite faces left.
          mesh.position.y = ROAD_Y + Math.abs(Math.sin(t / 90 + d.speed)) * 1.5;
        });
        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.life -= dt * 1.2; pt.vy -= pt.g * dt;
          pt.mesh.position.x += pt.vx * dt; pt.mesh.position.y += pt.vy * dt;
          pt.mesh.material.opacity = Math.max(0, pt.life);
          if (pt.life <= 0) { scene.remove(pt.mesh); pt.mesh.material.dispose(); particles.splice(i, 1); }
        }
      }

      function frame() {
        const t = now();
        const dt = Math.min(1000, t - lastTime) / 1000;
        lastTime = t; acc += dt;
        let changed = false;
        while (acc >= CONST.SIM_DT) {
          S.grain += productionPerSec(S) * CONST.SIM_DT;
          acc -= CONST.SIM_DT; changed = true;
        }
        if (S.settings && S.settings.autoSell && S.grain >= (S.settings.autoSellThreshold || 100)) {
          sellAllGrain();
        }
        animateFarm(t, dt);
        renderer.render(scene, camera);
        if (changed && t - lastRender >= CONST.RENDER_MS) {
          render(); lastRender = t;
        }
        rafId = requestAnimationFrame(frame);
      }
      function startLoop() {
        if (rafId) cancelAnimationFrame(rafId);
        lastTime = now(); lastRender = 0; acc = 0; rafId = requestAnimationFrame(frame);
      }
      function stopLoop() { if (rafId) cancelAnimationFrame(rafId); rafId = null; }

      // ─── Events ───
      function harvest(anchor) {
        const amount = harvestValue(S);
        S.grain += amount; S.stats.manualHarvests += 1;
        save(); render();
        spawnFloatingText("+" + format(amount) + " 🌾", anchor);
        spawnGrainParticles(Math.min(4, Math.log10(amount) + 1), anchor);
      }
      $('firstFieldAction').addEventListener('click', function() {
        const phase = firstFieldGoal(S).phase;
        if (phase === 'sell') sellAllGrain();
        else if (phase === 'buy' && buyProducer('field', 1)) {
          updateFarmVisuals(); showToast('First field planted', 'It grows 0.5 grain every second, even while you are away.');
        }
        render();
      });
      elBuyMode.addEventListener("click", function(e) {
        const button = e.target.closest("button[data-mode]");
        if (!button) return;
        buyMode = button.dataset.mode;
        for (const b of elBuyMode.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b === button));
        render();
      });
      btnSellAll.addEventListener("click", function() { if (sellAllGrain()) render(); });
      btnFertilizer.addEventListener("click", function() {
        if (!buyFertilizer()) return;
        const row = $("fertItem"); row.classList.remove("pop"); void row.offsetWidth; row.classList.add("pop");
        render();
      });
      btnHarvest.addEventListener("click", function() { harvest(btnHarvest); });
      // H harvests and S sells, unless the player is typing in a field.
      document.addEventListener("keydown", function(e) {
        if (e.repeat || e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
        const key = e.key.toLowerCase(), button = key === "h" ? btnHarvest : key === "s" ? btnSellAll : null;
        if (!button) return;
        button.classList.add("pressed"); setTimeout(function() { button.classList.remove("pressed"); }, 90);
        if (key === "h") harvest(btnHarvest);
        else if (sellAllGrain()) render();
      });
      btnPrestige.addEventListener("click", function() {
        const gain = prestigeGain();
        if (gain <= 0) return;
        if (!confirm("Start a new season for " + gain + " golden seed(s)? Fields, buildings, coins, grain and fertilizer reset; seeds boost production forever.")) return;
        if (doPrestige()) { render(); updateFarmVisuals(); showToast("New season!", "You collected " + gain + " golden seed(s). Production is now ×" + prestigeMultiplier(S).toFixed(2) + "."); }
      });
      cbAutoSell.addEventListener("change", function() {
        S.settings.autoSell = cbAutoSell.checked; save();
      });
      inpAutoSellThreshold.addEventListener("change", function() {
        S.settings.autoSellThreshold = Math.max(1, parseInt(inpAutoSellThreshold.value) || 100);
        inpAutoSellThreshold.value = S.settings.autoSellThreshold; save();
      });

      $("exportCopy").addEventListener("click", async function() {
        const data = JSON.stringify(S);
        try { await navigator.clipboard.writeText(data); showToast("Exported", "Save copied to clipboard!"); }
        catch { showToast("Error", "Could not copy to clipboard."); }
      });
      $("exportDownload").addEventListener("click", function() {
        const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = "idle-farm-save-" + Date.now() + ".json";
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      });
      $("importFileBtn").addEventListener("click", function() { $("importFile").click(); });
      $("importFile").addEventListener("change", async function(e) {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        try {
          const text = await f.text(); const obj = JSON.parse(text);
          importSave(obj);
        } catch { showToast("Error", "Invalid save file."); }
        e.target.value = "";
      });
      $("importPasteBtn").addEventListener("click", async function() {
        const text = prompt("Paste your save JSON:"); if (!text) return;
        try {
          const obj = JSON.parse(text);
          importSave(obj);
        } catch { showToast("Error", "Invalid save data."); }
      });
      $("resetBtn").addEventListener("click", function() {
        if (!confirm("Reset all progress? This cannot be undone.")) return;
        S = defaultState(); shownGoal = null; if (pausedSince !== null) pausedSince = now(); save(); render(); updateFarmVisuals();
      });

      document.addEventListener("visibilitychange", function() {
        if (document.hidden) { pausedSince = now(); save(); stopLoop(); }
        else {
          save();
          pausedSince = null;
          startLoop(); render();
        }
      });
      window.addEventListener("beforeunload", save);
      setInterval(save, CONST.AUTOSAVE_MS);

      // Start
      updateFarmVisuals();
      render();
      startLoop();
    })();
  </script>
</body>
</html>
